<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sana Özel...</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle, #2a0845 0%, #150324 100%);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Başlangıç Ekranı ve Buton */
        #start-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #2a0845 0%, #150324 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 1.5s ease;
        }

        .start-btn {
            padding: 15px 40px;
            font-size: 1.5rem;
            color: white;
            background: linear-gradient(45deg, #ff0055, #ff69b4);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(255, 105, 180, 0.6);
            transition: transform 0.2s;
            font-weight: bold;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .start-btn:active { transform: scale(0.95); }

        #particles {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1; pointer-events: none;
        }

        #flower-ring {
            position: absolute;
            width: 100%; height: 100%;
            z-index: 5;
            animation: rotateRing 25s linear infinite;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @keyframes rotateRing {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .ring-flower {
            position: absolute;
            font-size: 2.5rem;
            filter: drop-shadow(0 0 15px rgba(255,105,180,0.8));
        }

        .slider-container {
            position: relative;
            width: 320px; height: 480px;
            border-radius: 20px;
            box-shadow: 0 0 50px rgba(255, 105, 180, 0.6), 0 0 100px rgba(255, 105, 180, 0.4);
            border: 3px solid rgba(255, 255, 255, 0.3);
            z-index: 10; overflow: hidden;
        }

        .slide {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; opacity: 0;
            transition: opacity 1.5s ease-in-out, transform 6s linear;
            transform: scale(1.1);
        }

        .slide.active { opacity: 1; transform: scale(1); }

        .message {
            position: absolute;
            bottom: 25px; width: 100%;
            text-align: center; color: white;
            font-size: 1.6rem; font-weight: bold;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.9), 0 0 20px #ff0055;
            z-index: 20; pointer-events: none;
        }
    </style>
</head>
<body>
    <!-- Müzik Dosyası -->
    <audio id="bg-music" loop>
        <source src="sarki.mp3" type="audio/mpeg">
    </audio>

    <!-- Açılış Ekranı -->
    <div id="start-screen">
        <button class="start-btn" onclick="startGift()">Hediyeyi Aç 🎁</button>
    </div>

    <!-- Görsel Şölen -->
    <div id="particles"></div>
    <div id="flower-ring"></div>

    <div class="slider-container">
        <img src="file_000000002ac881f4bbedbcbf70615b0e.png" class="slide active" alt="Fotoğraf 1">
        <img src="IMG_20261029_130653.jpg" class="slide" alt="Fotoğraf 2">
        <img src="IMG-20261007-WA0011.jpg" class="slide" alt="Fotoğraf 3">
        <div class="message">İyi ki varsın 🤍</div>
    </div>

    <script>
        // Butona tıklandığında müziği ve sistemi başlatan fonksiyon
        function startGift() {
            const startScreen = document.getElementById('start-screen');
            const music = document.getElementById('bg-music');
            
            music.play(); // Müziği başlat
            startScreen.style.opacity = '0'; // Siyah ekranı yavaşça erit
            
            setTimeout(() => { 
                startScreen.style.display = 'none'; 
            }, 1500);
        }

        // Slider Döngüsü
        const slides = document.querySelectorAll('.slide');
        let currentSlide = 0;
        setInterval(() => {
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('active');
        }, 5000);

        // Gül ve Papatya Halkası
        const ring = document.getElementById('flower-ring');
        const radiusX = 220; 
        const radiusY = 320; 
        const totalFlowers = 20; 

        for(let i=0; i<totalFlowers; i++) {
            const flower = document.createElement('div');
            flower.className = 'ring-flower';
            flower.innerText = i % 2 === 0 ? '🌹' : '🌼';
            const angle = (i / totalFlowers) * 2 * Math.PI;
            const x = Math.cos(angle) * radiusX;
            const y = Math.sin(angle) * radiusY;
            flower.style.transform = `translate(${x}px, ${y}px) rotate(${angle}rad)`;
            ring.appendChild(flower);
        }

        // Arka Plan Işıltı Efektleri
        setInterval(() => {
            const p = document.createElement('div');
            p.innerText = Math.random() > 0.5 ? '✨' : '💖';
            p.style.position = 'absolute';
            p.style.left = Math.random() * 100 + 'vw';
            p.style.top = '-5vh';
            p.style.fontSize = Math.random() * 10 + 10 + 'px';
            p.style.opacity = Math.random();
            p.style.transition = 'top 6s linear, opacity 6s ease-in-out';
            
            document.getElementById('particles').appendChild(p);
            
            setTimeout(() => { p.style.top = '105vh'; p.style.opacity = 0; }, 50);
            setTimeout(() => { p.remove(); }, 6000);
        }, 400);
    </script>
</body>
</html>
